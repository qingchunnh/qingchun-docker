services:
  komari-agent:
    image: ghcr.io/komari-monitor/komari-agent:latest
    container_name: komari-agent
    restart: always
    network_mode: host
    command: -e 面板地址 -t token --disable-web-ssh --disable-auto-update --ignore-unsafe-cert --include-mountpoint /
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/os-release:/etc/os-release:ro