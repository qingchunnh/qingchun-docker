services:
  beszel-hub:
    image: henrygd/beszel:latest
    container_name: beszel-hub
    restart: unless-stopped
    environment:
      - 'TZ=Asia/Shanghai'
      - 'APP_URL=http://localhost:8090'
    ports:
      - 8090:8090
    volumes:
      - ./beszel_data:/beszel_data
    networks:
      - qingchun-network

networks:
  qingchun-network:
    external: true
