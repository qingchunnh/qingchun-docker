services:
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./beszel_agent_data:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # - /mnt/disk1/.beszel:/extra-filesystems/disk1:ro # 通过在 /extra-filesystems 中挂载文件夹来监控其他磁盘/分区
    environment:
      - 'TZ=Asia/Shanghai'
      - 'LISTEN=45876'
      - 'HUB_URL=Hub地址'
      - 'TOKEN=令牌'
      - 'KEY=密钥'
