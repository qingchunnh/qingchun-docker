services:
  nginx-ui:
    image: 'uozi/nginx-ui:latest'
    stdin_open: true
    tty: true
    container_name: nginx-ui
    restart: always
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - '/mnt/user/appdata/nginx:/etc/nginx'
      - '/mnt/user/appdata/nginx-ui:/etc/nginx-ui'
      - '/var/www:/var/www'
      - '/var/run/docker.sock:/var/run/docker.sock'
    ports:
      - 80:80
      - 443:443

