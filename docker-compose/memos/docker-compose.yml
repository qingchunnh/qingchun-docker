services:
  memos:
    image: neosmemo/memos:stable
    container_name: memos
    restart: unless-stopped
    ports:
      - "5230:5230"
    volumes:
      - ./data:/var/opt/memos
    environment:
      - TZ=Asia/Shanghai
      - MEMOS_PORT=5230
      - MEMOS_DRIVER=sqlite
      # - MEMOS_INSTANCE_URL=https://memos.example.com # 实例规范地址，未配置时保持私有模式
    networks:
      - qingchun-network

networks:
  qingchun-network:
    external: true