services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:16.0.2
    container_name: forgejo
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=postgres # 数据库类型
      - FORGEJO__database__HOST=host:port # 数据库地址
      - FORGEJO__database__NAME=forgejo # 数据库名称
      - FORGEJO__database__USER=user # 数据库用户名
      - FORGEJO__database__PASSWD=password # 数据库密码
    volumes:
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "222:22"
    networks:
      - qingchun-network

networks:
  qingchun-network:
    external: true
