services:
  openlist:
    image: openlistteam/openlist:latest
    container_name: openlist
    restart: unless-stopped
    user: '0:0'
    ports:
      - '5244:5244'
      - '5245:5245'
    volumes:
      - ./data:/opt/openlist/data
    environment:
      - TZ=Asia/Shanghai
      - UMASK=022
    networks:
      - qingchun-network

networks:
  qingchun-network:
    external: true

